# Exemplo; configure TLS e ServerName reais antes do deploy.
<VirtualHost *:80>
    ServerName lipepool.example
    DocumentRoot /var/www/lipepool/public

    <Directory /var/www/lipepool/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Não exponha arquivos de configuração, dependências, templates ou migrations.
    <Directory /var/www/lipepool>
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lipepool-error.log
    CustomLog ${APACHE_LOG_DIR}/lipepool-access.log combined
</VirtualHost>
